<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7fbff">
  <title>L.A.B デザイン制作AI｜プロンプトカタログ</title>
  <meta name="description" content="L.A.B AI WORK BASICのデザイン制作プロンプトカタログ。媒体別にデザイン例を探し、プロンプトをコピーできます。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2308173d'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-size='24' font-family='Arial' font-weight='700' fill='white'%3ELAB%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #08173d;
      --ink-2: #18264c;
      --blue: #178eea;
      --cyan: #58d7ff;
      --pink: #ff77b7;
      --paper: #ffffff;
      --wash: #f4f9ff;
      --line: #dce7f3;
      --muted: #68758e;
      --shadow: 0 22px 60px rgba(18, 61, 116, .13);
      --sans: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      --serif: "Iowan Old Style", "Yu Mincho", "Hiragino Mincho ProN", serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; overflow-x: hidden; color: var(--ink); background: var(--paper); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    button { color: inherit; font: inherit; }
    img { display: block; max-width: 100%; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    .hero {
      position: relative;
      min-height: 720px;
      overflow: hidden;
      background:
        radial-gradient(circle at 82% 18%, rgba(255, 119, 183, .18), transparent 27%),
        radial-gradient(circle at 14% 12%, rgba(88, 215, 255, .24), transparent 29%),
        linear-gradient(150deg, #eef9ff 0%, #f9fbff 46%, #fff 100%);
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .52;
      background-image: linear-gradient(rgba(23, 142, 234, .075) 1px, transparent 1px), linear-gradient(90deg, rgba(23, 142, 234, .075) 1px, transparent 1px);
      background-size: 88px 88px;
      mask-image: linear-gradient(90deg, #000 0%, rgba(0,0,0,.72) 45%, transparent 92%);
    }
    .hero::after { content: ""; position: absolute; left: -8vw; right: -8vw; bottom: -88px; height: 180px; border-radius: 50% 50% 0 0; background: #fff; }
    .hero-inner { position: relative; z-index: 1; width: min(1440px, 92vw); min-height: 700px; margin: auto; display: grid; grid-template-columns: .86fr 1.14fr; align-items: center; gap: clamp(20px, 4vw, 76px); }
    .brand-mark { width: 142px; margin-bottom: 34px; }
    .eyebrow { display: flex; align-items: center; gap: 16px; margin: 0 0 24px; color: var(--blue); font: 700 12px/1.4 var(--sans); letter-spacing: .18em; text-transform: uppercase; }
    .eyebrow::before { content: ""; width: 54px; height: 2px; background: linear-gradient(90deg, var(--blue), var(--pink)); }
    .hero h1 { margin: 0; font-family: var(--serif); font-size: clamp(42px, 4vw, 58px); font-weight: 600; line-height: 1.28; letter-spacing: -.025em; }
    .hero h1 em { display: block; color: var(--blue); font-style: normal; }
    .headline-line { display: block; white-space: nowrap; }
    .hero-lead { max-width: 610px; margin: 28px 0 34px; color: var(--ink-2); font-size: clamp(16px, 1.4vw, 19px); line-height: 1.9; letter-spacing: .01em; }
    .hero-meta { display: flex; flex-wrap: wrap; gap: 8px; }
    .hero-meta span { padding: 8px 12px; border: 1px solid rgba(8, 23, 61, .16); border-radius: 999px; background: rgba(255,255,255,.66); font-size: 11px; letter-spacing: .08em; backdrop-filter: blur(8px); }
    .hero-stage { position: relative; min-height: 650px; perspective: 1200px; }
    .book { position: absolute; z-index: 6; width: 48%; right: 24%; top: 7%; filter: drop-shadow(0 28px 26px rgba(7, 40, 91, .2)); transform: rotate(-2deg); }
    .sample { position: absolute; overflow: hidden; width: 37%; border: 7px solid #fff; background: #fff; box-shadow: var(--shadow); }
    .sample img { width: 100%; height: 100%; object-fit: cover; }
    .sample-a { z-index: 2; right: 1%; top: 6%; height: 29%; transform: rotate(5deg); }
    .sample-b { z-index: 3; left: 2%; top: 12%; height: 27%; transform: rotate(-5deg); }
    .sample-c { z-index: 4; right: 1%; bottom: 13%; height: 27%; transform: rotate(-4deg); }
    .sample-d { z-index: 5; left: 1%; bottom: 9%; height: 25%; transform: rotate(4deg); }
    .stage-line { position: absolute; z-index: 1; left: 12%; right: 8%; top: 48%; height: 1px; background: linear-gradient(90deg, transparent, rgba(23,142,234,.55), rgba(255,119,183,.6), transparent); transform: rotate(-10deg); }

    .catalog { position: relative; z-index: 2; padding: 36px 0 104px; background: #fff; }
    .catalog-inner { width: min(1440px, 92vw); margin: auto; }
    .catalog-head { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px; margin-bottom: 30px; }
    .catalog h2 { margin: 0 0 9px; font-family: var(--serif); font-size: clamp(36px, 4vw, 58px); font-weight: 600; line-height: 1.15; letter-spacing: -.025em; }
    .catalog-head p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .count { color: var(--blue); font: 700 13px/1.4 var(--sans); letter-spacing: .14em; }
    .filters { position: sticky; z-index: 20; top: 0; display: flex; gap: 9px; overflow-x: auto; margin: 0 0 26px; padding: 14px 0 18px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.94); backdrop-filter: blur(14px); scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter { flex: 0 0 auto; padding: 11px 18px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: #33415e; font-size: 14px; font-weight: 700; cursor: pointer; transition: .2s ease; }
    .filter:hover { border-color: var(--blue); color: var(--blue); }
    .filter.active { border-color: var(--ink); color: #fff; background: var(--ink); box-shadow: 0 8px 18px rgba(8, 23, 61, .16); }
    .grid { columns: 4; column-gap: 18px; }
    .card { display: block; width: 100%; break-inside: avoid; margin: 0 0 18px; padding: 0; overflow: hidden; border: 1px solid #e4ebf4; background: #fff; box-shadow: 0 8px 26px rgba(15, 48, 91, .07); cursor: pointer; transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
    .card:hover { z-index: 1; transform: translateY(-4px); border-color: rgba(23,142,234,.35); box-shadow: 0 18px 40px rgba(15, 48, 91, .15); }
    .card:focus-visible { outline: 3px solid rgba(23,142,234,.4); outline-offset: 3px; }
    .card img { width: 100%; height: auto; }
    .empty { grid-column: 1 / -1; padding: 64px 20px; color: var(--muted); text-align: center; }
    .footer { padding: 36px 4vw; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; text-align: center; letter-spacing: .08em; }

    dialog { width: min(1180px, 94vw); max-height: 92vh; padding: 0; border: 0; border-radius: 12px; background: #fff; box-shadow: 0 28px 100px rgba(3, 20, 50, .34); }
    dialog::backdrop { background: rgba(3, 12, 35, .72); backdrop-filter: blur(4px); }
    .modal { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(360px, .92fr); min-height: 580px; }
    .modal-image { display: grid; min-height: 580px; place-items: center; padding: 24px; background: linear-gradient(145deg, #eef7ff, #f8fbff); }
    .modal-image img { max-width: 100%; max-height: 82vh; object-fit: contain; box-shadow: 0 18px 44px rgba(12, 54, 105, .12); }
    .modal-copy { display: flex; max-height: 92vh; flex-direction: column; padding: 34px; overflow: auto; }
    .modal-label { margin: 0; color: var(--blue); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    .modal-copy h3 { margin: 10px 0 20px; font-family: var(--serif); font-size: 26px; font-weight: 600; line-height: 1.45; }
    .prompt-panel[hidden], .no-prompt[hidden] { display: none; }
    .prompt-head { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    .copy-prompt { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--blue); border-radius: 8px; background: #fff; color: var(--blue); font-size: 13px; font-weight: 700; cursor: pointer; }
    .copy-prompt svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
    .copy-prompt.copied { color: #fff; background: var(--blue); }
    .prompt-text { max-height: 54vh; margin: 0; padding: 18px; overflow: auto; border: 1px solid var(--line); border-radius: 9px; background: var(--wash); color: #24324e; font: 14px/1.85 var(--sans); overflow-wrap: anywhere; white-space: pre-wrap; }
    .no-prompt { color: var(--muted); line-height: 1.8; }
    .close { margin-top: auto; padding: 13px 16px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-weight: 700; cursor: pointer; }
    .close:hover { border-color: var(--ink); }

    @media (max-width: 1040px) {
      .hero-inner { grid-template-columns: .9fr 1.1fr; }
      .hero-stage { min-height: 590px; }
      .grid { columns: 3; }
    }
    @media (max-width: 768px) {
      .hero { min-height: auto; }
      .hero::after { bottom: -108px; }
      .hero-inner { min-height: auto; padding: 68px 0 110px; grid-template-columns: 1fr; gap: 12px; }
      .brand-mark { width: 108px; margin-bottom: 26px; }
      .hero h1 { max-width: 640px; font-size: clamp(38px, 7.5vw, 58px); line-height: 1.28; }
      .hero-lead { margin: 22px 0 26px; }
      .hero-stage { width: min(640px, 100%); min-height: 540px; margin: -6px auto 0; }
      .book { width: 46%; right: 27%; top: 5%; }
      .catalog { padding-top: 10px; }
      .grid { columns: 2; column-gap: 11px; }
      .card { margin-bottom: 11px; }
      .modal { grid-template-columns: 1fr; }
      .modal-image { min-height: 320px; max-height: 47vh; padding: 18px; }
      .modal-image img { max-height: 42vh; }
      .modal-copy { max-height: 45vh; padding: 22px; }
      .close { margin-top: 24px; }
    }
    @media (max-width: 520px) {
      .hero-inner, .catalog-inner { width: calc(100% - 36px); }
      .hero-inner { padding-top: max(44px, env(safe-area-inset-top)); padding-bottom: 90px; }
      .brand-mark { width: 92px; margin-bottom: 22px; }
      .eyebrow { margin-bottom: 18px; font-size: 10px; letter-spacing: .14em; }
      .eyebrow::before { width: 38px; }
      .hero h1 { font-size: clamp(34px, 9vw, 40px); letter-spacing: -.035em; }
      .hero-lead { font-size: 15px; line-height: 1.85; }
      .hero-meta span { padding: 7px 10px; font-size: 10px; }
      .hero-stage { min-height: 390px; margin-top: 8px; }
      .book { width: 54%; right: 23%; top: 4%; }
      .sample { width: 38%; border-width: 4px; }
      .sample-a { right: -5%; top: 7%; height: 28%; }
      .sample-b { left: -5%; top: 13%; height: 27%; }
      .sample-c { right: -4%; bottom: 11%; height: 27%; }
      .sample-d { left: -5%; bottom: 8%; height: 24%; }
      .catalog-head { grid-template-columns: 1fr; gap: 12px; margin-bottom: 18px; }
      .catalog h2 { font-size: 38px; }
      .filters { margin-right: -18px; padding-right: 18px; }
      .filter { padding: 10px 15px; font-size: 13px; }
      dialog { width: calc(100vw - 20px); max-height: 94vh; }
      .modal-copy h3 { font-size: 21px; }
      .prompt-text { font-size: 13px; line-height: 1.75; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-copy">
        <img class="brand-mark" src="brand/lab-logo.png" alt="L.A.B LIFE / ALCHEMY / BUSINESS">
        <p class="eyebrow">L.A.B AI WORK BASIC</p>
        <h1><span class="headline-line">デザインを探す。</span><em><span class="headline-line">プロンプトを</span><span class="headline-line">持ち帰る。</span></em></h1>
        <p class="hero-lead">媒体別のデザイン例から、作りたい表現のヒントを探せます。<br>気になる作例を開いて、そのままプロンプトをコピー。</p>
        <div class="hero-meta" aria-label="カタログの特徴"><span>446 DESIGNS</span><span>9 CATEGORIES</span><span>COPY &amp; CREATE</span></div>
      </div>
      <div class="hero-stage" aria-hidden="true">
        <span class="stage-line"></span>
        <figure class="sample sample-a"><img src="thumbs/170.webp" alt=""></figure>
        <figure class="sample sample-b"><img src="thumbs/348.webp" alt=""></figure>
        <img class="book" src="brand/lab-prompt-catalog.png" alt="">
        <figure class="sample sample-c"><img src="thumbs/426.webp" alt=""></figure>
        <figure class="sample sample-d"><img src="thumbs/274.webp" alt=""></figure>
      </div>
    </div>
  </header>

  <main class="catalog" id="catalog">
    <div class="catalog-inner">
      <div class="catalog-head">
        <div>
          <h2>Design Catalog</h2>
          <p>媒体を選んで、作りたいデザインのヒントを探せます。</p>
        </div>
        <div class="count" id="count" aria-live="polite">LOADING</div>
      </div>
      <nav class="filters" id="filters" aria-label="媒体カテゴリー"></nav>
      <section class="grid" id="grid" aria-live="polite" aria-label="デザイン一覧"></section>
    </div>
  </main>

  <footer class="footer">L.A.B AI WORK BASIC · PROMPT CATALOG</footer>

  <dialog id="detail" aria-labelledby="detailTitle">
    <div class="modal">
      <div class="modal-image"><img id="detailImage" alt=""></div>
      <div class="modal-copy">
        <p class="modal-label" id="detailCategory"></p>
        <h3 id="detailTitle"></h3>
        <div class="prompt-panel" id="promptPanel" hidden>
          <div class="prompt-head"><button class="copy-prompt" id="copyPrompt" type="button" aria-label="プロンプトをコピー"></button></div>
          <pre class="prompt-text" id="promptText"></pre>
        </div>
        <p class="no-prompt" id="noPrompt">プロンプトを読み込んでいます…</p>
        <button class="close" id="close" type="button">一覧へ戻る</button>
      </div>
    </div>
  </dialog>

  <script>
    const categories = ["すべて", "LP", "ホームページ", "チラシ", "広告バナー", "スライド", "YouTube", "Instagram", "LINE", "EC商品画像"];
    const allOrder = ["チラシ", "LP", "ホームページ", "広告バナー", "スライド", "YouTube", "Instagram", "LINE", "EC商品画像"];
    const state = { items: [], prompts: {}, category: "すべて", activeId: null };
    const grid = document.querySelector("#grid");
    const filters = document.querySelector("#filters");
    const count = document.querySelector("#count");
    const detail = document.querySelector("#detail");
    const detailImage = document.querySelector("#detailImage");
    const detailCategory = document.querySelector("#detailCategory");
    const detailTitle = document.querySelector("#detailTitle");
    const promptPanel = document.querySelector("#promptPanel");
    const noPrompt = document.querySelector("#noPrompt");
    const promptText = document.querySelector("#promptText");
    const copyPrompt = document.querySelector("#copyPrompt");
    const visibleItems = () => state.category === "すべて"
      ? [...state.items].sort((a, b) => allOrder.indexOf(a.category) - allOrder.indexOf(b.category) || a.id - b.id)
      : state.items.filter(item => item.category === state.category);

    function renderFilters() {
      filters.innerHTML = categories.map(category => `
        <button type="button" class="filter ${category === state.category ? "active" : ""}" data-category="${category}" aria-pressed="${category === state.category}">${category}</button>
      `).join("");
    }

    function renderGrid() {
      const items = visibleItems();
      count.textContent = `${items.length} DESIGNS`;
      grid.innerHTML = items.length ? items.map((item, index) => `
        <button type="button" class="card" data-id="${item.id}" aria-label="${item.title || `${item.category}のデザイン例`}を開く">
          <img src="${item.thumbnail || item.image}" width="${item.width || 640}" height="${item.height || 360}" alt="${item.category}のデザイン例" loading="${index < 8 ? "eager" : "lazy"}" decoding="async">
        </button>
      `).join("") : `<p class="empty">該当するデザインはありません。</p>`;
    }

    function chooseCategory(category) {
      state.category = category;
      renderFilters();
      renderGrid();
      document.querySelector("#catalog").scrollIntoView({ behavior: "smooth" });
    }

    const copyIcon = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>`;
    const checkIcon = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"></path></svg>`;
    function setCopyState(copied) {
      copyPrompt.classList.toggle("copied", copied);
      copyPrompt.innerHTML = `${copied ? checkIcon : copyIcon}<span>${copied ? "コピーしました" : "プロンプトをコピー"}</span>`;
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.setAttribute("readonly", "");
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();
      const copied = document.execCommand("copy");
      textarea.remove();
      if (!copied) throw new Error("copy unavailable");
    }

    async function openCard(id) {
      const item = state.items.find(candidate => candidate.id === Number(id));
      if (!item) return;
      state.activeId = item.id;
      detailImage.src = item.image;
      detailImage.alt = `${item.category}のデザイン例`;
      detailCategory.textContent = item.category;
      detailTitle.textContent = item.title || `${item.category} デザイン ${String(item.id).padStart(3, "0")}`;
      promptPanel.hidden = true;
      noPrompt.hidden = false;
      noPrompt.textContent = "プロンプトを読み込んでいます…";
      promptText.textContent = "";
      copyPrompt.dataset.prompt = "";
      copyPrompt.disabled = true;
      setCopyState(false);
      detail.showModal();
      try {
        const prompt = await (state.prompts[item.id] ||= fetch(`prompts/${item.id}.json`).then(response => {
          if (!response.ok) throw new Error("prompt unavailable");
          return response.json();
        }).catch(error => {
          delete state.prompts[item.id];
          throw error;
        }));
        if (state.activeId !== item.id || !detail.open) return;
        const hasPrompt = Boolean(prompt?.prompt);
        promptPanel.hidden = !hasPrompt;
        noPrompt.hidden = hasPrompt;
        noPrompt.textContent = "このデザインのプロンプトは準備中です。";
        promptText.textContent = prompt?.prompt || "";
        copyPrompt.dataset.prompt = prompt?.prompt || "";
        copyPrompt.disabled = !hasPrompt;
      } catch (error) {
        if (state.activeId === item.id && detail.open) noPrompt.textContent = "このデザインのプロンプトは準備中です。";
      }
    }

    filters.addEventListener("click", event => {
      const button = event.target.closest("button[data-category]");
      if (button) chooseCategory(button.dataset.category);
    });
    grid.addEventListener("click", event => {
      const card = event.target.closest("button[data-id]");
      if (card) openCard(card.dataset.id);
    });
    copyPrompt.addEventListener("click", async () => {
      try {
        await copyText(copyPrompt.dataset.prompt);
        setCopyState(true);
      } catch (error) {
        copyPrompt.innerHTML = `${copyIcon}<span>選択してコピーしてください</span>`;
        promptText.focus();
      }
    });
    document.querySelector("#close").addEventListener("click", () => detail.close());
    detail.addEventListener("click", event => {
      const rect = detail.getBoundingClientRect();
      const outside = event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom;
      if (outside) detail.close();
    });
    detail.addEventListener("close", () => { state.activeId = null; });

    fetch("catalog.json")
      .then(response => {
        if (!response.ok) throw new Error("catalog unavailable");
        return response.json();
      })
      .then(items => {
        state.items = items;
        renderFilters();
        renderGrid();
      })
      .catch(() => {
        count.textContent = "0 DESIGNS";
        grid.innerHTML = `<p class="empty">カタログを読み込めませんでした。</p>`;
      });
  </script>
</body>
</html>
